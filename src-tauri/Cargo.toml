[package]
name = "app"
version = "0.9.0"
description = "Mystral Editor"
authors = ["jfb"]
license = "GPL 3.0+"
repository = "https://github.com/jfbercher/Mystral-Editor/"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1.53.1", features = ["time", "rt"] }

# Native Google OAuth loopback flow (src/google_auth.rs).
# Google blocks OAuth inside embedded webviews, so sign-in has to happen in the
# system browser and come back over a 127.0.0.1 redirect handled here.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
