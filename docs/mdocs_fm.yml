version: 1

project:
  title: Mystral Editor
  subtitle: Mystral Editor
  date: 2026-10-04
  license: GPL-3.0-or-later
  github: https://github.com/jfbercher/Mystral-Editor
  settings:
    myst_to_tex:
      code_style: listings
    output_stderr: remove
    output_matplotlib_strings: remove

  exports:
    - format: tex
      template: arxiv_nips
      article_type: article
    - format: pdf
      template: arxiv_nips
      article_type: article
      articles:
        - file: presentation.md
        - file: completion.md  
        - file: export.md
        - file: toc.md
        - file: include.md   
        - file: directives-and-roles.md  
        - file: executable-content.md
        - file: project-frontmatter-extends.md
        - file: customisation.md  
        - file: myst-editor-css-variables.md
        - file: windows_app_installation_guide.md
        - file: macos_app_installation_guide.md  
        - file: keyboard_shortcuts_en.md 

  numbering:
    headings: true
    equations: true 
    figure: true